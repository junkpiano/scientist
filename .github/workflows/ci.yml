name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  spm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift build -v
      - run: swift test -v

  pod-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec pod lib lint --allow-warnings
